<script>
const slides=[{"title": "从设计生成，到设计代理", "image": "assets/slide-01.webp", "text": "从设计生成\n到设计代理\n以Lovart 2.0为例，探索 AI 设计工作流的下一阶段\nUED 四组 / 于浩然\n2026.10"}, {"title": "设计流程正在发生变化", "image": "assets/slide-02.webp", "text": "设计流程正在发生变化\nAI 的参与范围，正在从视觉执行延伸到完整设计流程\n传统设计流程\nAI 参与的流程\n前期调研\n前期调研\n中期执行\n中期执行\n后期沉淀\n后期沉淀\nUED 四组 / 于浩然\n2026.10"}, {"title": "生成一张图片，不等于完成一次设计", "image": "assets/slide-03.webp", "text": "生成一张图片，不等于完成一次设计\n即便在AI时代完成一个完整的设计任务依然是复杂的\n设计前\n理解与定向\n理解需求\n收集参考\n确定视觉方向\n设计中\n创作与改进\n制作素材\n探索方案\n处理多轮反馈\n设计后\n检查与交付\n检查规范\n延展物料\n整理可编辑资产\nUED 四组 / 于浩然\n2026.10"}, {"title": "AI 该如何介入整个设计流程", "image": "assets/slide-04.webp", "text": "UED 四组 / 于浩然\n2026.10\nAI该如何介入到整个设计流程\n从告诉 AI「生成什么」，到告诉 AI「完成什么」\nBefore\nNow\n生成式 AI\n以单次指令为中心\n输入指令 → 生成内容\n后续步骤由人继续组织\nAI AGENT\n以任务目标为中心\n理解目标 → 规划步骤 → 调用工具\n检查结果，并根据反馈继续调整"}, {"title": "Meet Arti · 六项核心能力", "image": "assets/slide-05.webp", "text": "UED 四组 / 于浩然\n2026.10\nMeet Arti\nLovart 2.0 推出的设计助手功能\n六项能力，贯穿设计全过程\n理解你的习惯，参与执行过程，复用成功方法"}, {"title": "01 · 记住你的设计习惯", "image": "assets/slide-06.webp", "text": "UED 四组 / 于浩然\n2026.10\n01 · 记住你的设计习惯\n让每一次新任务，不再从零解释\nINPUT / 输入\n你的偏好与资产\n角色背景、品牌色、\n常用素材与协作习惯\nACTION / 协作\n持续积累上下文\n在新项目中沿用习惯，\n减少重复交代\nOUTPUT / 结果\n连续的项目协作\n保留有效偏好，\n按任务调整具体要求"}, {"title": "02 · 从一次生成，到持续执行", "image": "assets/slide-07.webp", "text": "UED 四组 / 于浩然\n2026.10\n02 · 从一次生成，到持续执行\n把重复任务，变成可委托的工作\n01\n描述任务\n目标、参考、交付规格\n02\n设置周期\n单次 / 每日 / 每周 / 每月\n03\n试运行\n检查产出，再调整要求\n04\n查看结果\n运行记录与实际消耗"}, {"title": "03 · 把前期调研交给 AI", "image": "assets/slide-08.webp", "text": "UED 四组 / 于浩然\n2026.10\n03 · 把前期调研交给 AI*\n让创意探索，从更充分的信息开始\nINPUT / 输入\n研究问题\n目标用户、使用场景、\n竞品范围与视觉方向\nACTION / 协作\n收集与整理参考\n检索资料，归纳方向，\n组织参考与情绪板\nOUTPUT / 结果\n带来源的研究报告\n参考资料 + 来源信息\n+ Moodboard"}, {"title": "04 · AI 也能成为设计检查员", "image": "assets/slide-09.webp", "text": "UED 四组 / 于浩然\n2026.10\n04 · AI 也能成为设计检查员\n对照需求与一致性规则，辅助发现画布中的偏差\n检查项目\n画布中可能出现的偏差\n人工确认\n品牌色\n主色偏离指定范围\n保留 / 修改\n字体与层级\n标题或正文样式不统一\n保留 / 修改\n角色与材质\n比例、灯光或质感漂移\n保留 / 修改"}, {"title": "05 · 从零散反馈，到集中修改", "image": "assets/slide-10.webp", "text": "UED 四组 / 于浩然\n2026.10\n05 · 从零散反馈，到集中修改\n把分散的审阅意见，变成清晰的执行计划\n零散反馈 / 示例\n「标题更醒目一些」\n「人物比例需要统一」\n「主色再靠近品牌色」\n→\n集中修改方案 / 示例\n01  调整标题字号与层级\n02  按参考统一人物比例\n03  校正主色并复核系列\n澄清冲突 → 选择修改项 → 确认执行"}, {"title": "06 · 把重复经验，沉淀为 Skills", "image": "assets/slide-11.webp", "text": "UED 四组 / 于浩然\n2026.10\n06 · 把重复经验，沉淀为 Skills\n让成功的方法，可以在下一次任务中复用\n项目中反复出现的约束\n角色比例保持一致\n材质使用柔和的塑料质感\n光源固定从左上方照入\n输出透明背景与指定尺寸\n可复用 Skill / 方法示例\n品牌角色视觉规范\n输入：角色与场景\n步骤：生成 → 对照规范 → 修改\n输出：满足规格的角色素材\n→"}, {"title": "设计工具正在走向 Agent", "image": "assets/slide-12.webp", "text": "UED 四组 / 于浩然\n2026.10\n设计工具正在走向 Agent\n两条产品路径，都在让 AI 更深入地参与实际设计过程\nLOVART 2.0\n个人设计协作\n记住偏好与常用资产\n接受设计委托\n研究、审阅与流程复用\nFIGMA AGENT\n原生画布协作\n使用真实组件与变量\n结合设计系统创建与编辑\n在画布中处理多步任务"}, {"title": "从 Prompt 到 Skills：让经验成为能力", "image": "assets/slide-13.webp", "text": "UED 四组 / 于浩然\n2026.10\n从 Prompt 到 Skills：让经验成为能力\nPrompt 解决这一次怎么做；Skills 沉淀类似任务的稳定方法\n01\nPrompt\n这次要做什么\n02\n设计规范\n哪些约束不能变\n03\n流程封装\n按什么顺序执行\n04\nSkills\n类似任务如何复用"}, {"title": "生成越容易，设计一致性越重要", "image": "assets/slide-14.webp", "text": "UED 四组 / 于浩然\n2026.10\n生成越容易，设计一致性越重要\n方案数量增加之后，更需要清楚地定义什么可以交付\n01\n品牌一致\n主色、字体、信息层级与识别元素\n02\n视觉一致\n人物比例、灯光方向、材质与画面气质\n03\n交付一致\n尺寸、裁切范围、命名与可编辑性"}, {"title": "当 AI 能执行更多工作，设计师负责什么", "image": "assets/slide-15.webp", "text": "UED 四组 / 于浩然\n2026.10\n当 AI 能执行更多工作，设计师负责什么\n把更多注意力放在问题、过程和结果的判断上\n执行层面\n判断与组织\n如何制作\n→\n做什么、为什么做\n操作效率\n→\n工作流设计与管理\n反复修改\n→\n质量判断与方向把控\n个人经验\n→\n方法沉淀与团队复用"}, {"title": "感谢观看", "image": "assets/slide-16.webp", "text": "感谢观看\nUED 四组 / 于浩然\n2026.10"}];
const $=id=>document.getElementById(id);
const track=$('track'),progress=$('progress'),grid=$('grid');
const pad=n=>String(n).padStart(2,'0');
let index=0,startX=null,startY=null,toastTimer;
slides.forEach((slide,i)=>{
 const figure=document.createElement('figure');figure.className='slide';figure.setAttribute('role','group');figure.setAttribute('aria-roledescription','幻灯片');figure.setAttribute('aria-label',`${i+1} / ${slides.length}：${slide.title}`);
 const image=new Image();image.src=slide.image;image.alt=slide.title;image.width=1920;image.height=1080;image.loading=i<2?'eager':'lazy';image.decoding='async';if(i===0)image.fetchPriority='high';
 image.addEventListener('error',()=>{const fallback=document.createElement('div');fallback.className='image-error';const title=document.createElement('h2');title.textContent=slide.title;const copy=document.createElement('p');copy.textContent='页面图片暂时没有加载成功，请检查连接后重试。';const retry=document.createElement('button');retry.textContent='重新加载';retry.className='tool';retry.onclick=()=>{fallback.remove();image.src=slide.image};fallback.append(title,copy,retry);figure.append(fallback)});
 const text=document.createElement('figcaption');text.className='sr-only';text.textContent=slide.text;figure.append(image,text);track.append(figure);
 const point=document.createElement('button');point.title=`${pad(i+1)} · ${slide.title}`;point.setAttribute('aria-label',`第 ${i+1} 页：${slide.title}`);point.onclick=()=>go(i);progress.append(point);
 const thumb=document.createElement('button');thumb.className='thumb';thumb.setAttribute('aria-label',`打开第 ${i+1} 页：${slide.title}`);const preview=new Image();preview.src=slide.image;preview.alt='';preview.loading='lazy';const label=document.createElement('span');const number=document.createElement('b');number.textContent=pad(i+1);label.append(number,document.createTextNode(slide.title));thumb.append(preview,label);thumb.onclick=()=>{$('overview').close();go(i)};grid.append(thumb);
});
function fromHash(){const match=location.hash.match(/^#(?:slide-)?(\d+)$/);return match?Number(match[1])-1:0}
function go(value,updateHash=true){index=Math.max(0,Math.min(slides.length-1,Number.isFinite(value)?value:0));track.style.transform=`translate3d(${-index*100}%,0,0)`;$('number').textContent=pad(index+1);$('total').textContent=` / ${pad(slides.length)}`;$('caption').textContent=slides[index].title;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;document.title=`${pad(index+1)} · ${slides[index].title}｜从设计生成到设计代理`;[...track.children].forEach((el,i)=>{el.setAttribute('aria-hidden',String(i!==index));el.inert=i!==index});[...progress.children].forEach((el,i)=>{if(i===index)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');el.classList.toggle('past',i<index)});[...grid.children].forEach((el,i)=>{if(i===index)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(updateHash){try{history.replaceState(null,'',`#slide-${index+1}`)}catch{location.hash=`slide-${index+1}`}}$('announcement').textContent=`第 ${index+1} 页，共 ${slides.length} 页。${slides[index].title}`;for(const adjacent of [index-1,index,index+1]){const img=track.children[adjacent]?.querySelector('img');if(img)img.loading='eager'}}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3000)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('当前浏览器不支持全屏，可使用横屏查看。')}catch{toast('暂时无法进入全屏，请在浏览器中打开后重试。')}}
function openOverview(){$('overview').showModal();requestAnimationFrame(()=>grid.children[index].focus())}
$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('fullButton').onclick=fullscreen;$('overviewButton').onclick=openOverview;$('helpButton').onclick=()=>$('help').showModal();
document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;$('fullButton').setAttribute('aria-label',active?'退出全屏':'全屏展示');$('fullButton').querySelector('span').textContent=active?'退出全屏':'全屏'});
document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>$(el.dataset.close).close());document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog){const rect=dialog.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)dialog.close()}}));
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const key=e.key;if(['ArrowRight','PageDown'].includes(key)||(key===' '&&e.target===document.body)){e.preventDefault();go(index+1)}else if(['ArrowLeft','PageUp'].includes(key)){e.preventDefault();go(index-1)}else if(key==='Home'){e.preventDefault();go(0)}else if(key==='End'){e.preventDefault();go(slides.length-1)}else if(key.toLowerCase()==='f'){e.preventDefault();fullscreen()}else if(key.toLowerCase()==='g'){e.preventDefault();openOverview()}else if(key==='?'){$('help').showModal()}});
$('stage').addEventListener('touchstart',e=>{if(e.touches.length!==1){startX=null;return}startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(startX===null)return;const x=e.changedTouches[0].clientX-startX,y=e.changedTouches[0].clientY-startY;if(Math.abs(x)>50&&Math.abs(x)>Math.abs(y)*1.3)go(index+(x<0?1:-1));startX=null},{passive:true});$('stage').addEventListener('touchcancel',()=>startX=null,{passive:true});
window.addEventListener('hashchange',()=>go(fromHash(),false));go(fromHash(),false);
</script>
